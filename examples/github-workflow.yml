# .github/workflows/sutramx.yml
# Pull requests that touch sutramx.yml get the plan as a comment; merging to
# main applies it. Add the API key as the repository secret SUTRAMX_API_KEY
# (an "Automation access" key if the file manages integrations).
name: SutramX monitors

on:
  pull_request:
    paths: [sutramx.yml]
  push:
    branches: [main]
    paths: [sutramx.yml]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: sutramx-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: plan
        # Until the action is published, copy cli/action/ into your repo and use: ./.github/actions/sutramx
        uses: sutramx/cli/action@v1
        with:
          command: diff
          api-key: ${{ secrets.SUTRAMX_API_KEY }}
      - name: Comment the plan on the pull request
        uses: actions/github-script@v7
        env:
          PLAN: ${{ steps.plan.outputs.plan }}
          HAS_CHANGES: ${{ steps.plan.outputs.has-changes }}
        with:
          script: |
            const marker = '<!-- sutramx-plan -->';
            const body = `${marker}\n### SutramX plan${process.env.HAS_CHANGES === 'true' ? '' : ' (no changes)'}\n\`\`\`\n${process.env.PLAN}\n\`\`\``;
            const { data: comments } = await github.rest.issues.listComments({ ...context.repo, issue_number: context.issue.number });
            const existing = comments.find((comment) => comment.body?.startsWith(marker));
            if (existing) await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            else await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });

  apply:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: sutramx/cli/action@v1
        with:
          command: apply
          api-key: ${{ secrets.SUTRAMX_API_KEY }}
