# Publishes @sutramx/cli to npm when a version tag (v1.2.3) is pushed.
# Uses npm Trusted Publishing (OIDC): no npm token is stored anywhere. The
# package's npm settings trust SutramX/cli, workflow release.yml,
# environment npm. npm shows the release as published by GitHub Actions,
# with provenance linking it to this run (GitHub-hosted runners only).
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write # npm Trusted Publishing + provenance (OIDC)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Tag must match package.json and src/version.ts
        run: node scripts/check-version.mjs "$TAG"
        env:
          TAG: ${{ github.ref_name }}
      - name: npm with Trusted Publishing support (>= 11.5.1)
        run: npm install -g npm@^11.5.1
      - run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Package contents
        run: npm pack --dry-run
      - name: Publish
        run: npm publish --provenance --access public
